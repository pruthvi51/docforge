[project]
name = "docforge"
version = "1.0.0"
description = "Intelligent Clinical Document Extraction Pipeline Converting Unstructured Records into FHIR R4 and OMOP CDM"
authors = [{ name = "Pruthvi Nag Gattu", email = "gattupruthvinag5@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "streamlit>=1.33.0",
    "plotly>=5.20.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "rapidfuzz>=3.8.0",
    "jinja2>=3.1.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.5",
    "mypy>=1.9.0",
]

[project.scripts]
docforge = "docforge.cli:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

